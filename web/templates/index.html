<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOWA - Enterprise WhatsApp Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <div id="modal" class="fixed inset-0 modal-bg z-50 hidden items-center justify-center">
        <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md mx-4 fade-in border border-slate-700">
            <div id="modal-title" class="text-lg font-bold mb-4"></div>
            <div id="modal-body"></div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">GOWA Enterprise</h1>
                <p class="text-slate-500 text-sm">Multi-Session WhatsApp Gateway</p>
            </div>
        </header>

        <div class="flex gap-2 mb-6 border-b border-slate-800 pb-3 overflow-x-auto">
            <button onclick="switchTab('sessions')" class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium border border-transparent transition" data-tab="sessions">📱 Sessions</button>
            <button onclick="switchTab('katalog')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium border border-transparent transition text-slate-400 hover:text-white" data-tab="katalog">📦 Katalog</button>
            <button onclick="switchTab('whitelist')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium border border-transparent transition text-slate-400 hover:text-white" data-tab="whitelist">🛡️ Whitelist</button>
            <button onclick="switchTab('bulk')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium border border-transparent transition text-slate-400 hover:text-white" data-tab="bulk">📤 Bulk Sender</button>
        </div>

        <div id="tab-sessions">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">WhatsApp Sessions</h2>
                <button onclick="showAddSession()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">+ Add Session</button>
            </div>
            <div id="sessions-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-500 col-span-full text-center py-12">Loading...</p>
            </div>
        </div>

        <div id="tab-katalog" class="hidden">
            <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="text-lg font-semibold">Auto-Response Katalog</h2>
                    <select id="katalog-session-select" onchange="loadKatalog()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="">-- Select Session --</option>
                    </select>
                </div>
                
                <div class="flex items-center gap-2">
                    <a id="btn-export-katalog" href="#" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold transition opacity-50 cursor-not-allowed pointer-events-none">
                        📤 Export CSV
                    </a>
                    
                    <label class="bg-indigo-600 hover:bg-indigo-700 cursor-pointer px-4 py-2 rounded-lg text-sm font-semibold transition">
                        📥 Import CSV
                        <input type="file" id="import-katalog-file" accept=".csv" class="hidden" onchange="handleImportCSV(event)">
                    </label>

                    <button id="btn-add-katalog" onclick="showAddKatalog()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg text-sm font-semibold transition opacity-50 cursor-not-allowed" disabled>+ Add Keyword</button>
                </div>
            </div>
            <div id="katalog-list" class="space-y-2"></div>
        </div>

        <div id="tab-whitelist" class="hidden">
          <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
            <div class="flex items-center gap-3">
              <h2 class="text-lg font-semibold">Admin Whitelist</h2>
              <select id="whitelist-session-select" onchange="loadWhitelist()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-purple-500">
                <option value="">-- Select Session --</option>
              </select>
            </div>
            <button id="btn-add-whitelist" onclick="showAddWhitelist()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-semibold transition opacity-50 cursor-not-allowed" disabled>+ Add Number</button>
          </div>
          <div id="whitelist-list" class="space-y-2"></div>
        </div>

        <div id="tab-bulk" class="hidden"> ... </div>

    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
